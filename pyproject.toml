[project]
name = "eodhp-git-change-scanner"
version = "0.1.4"
description = "Collects and updates S3 buckets from GitHub repositories"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {file = "LICENSE"}

authors = [
  {name = "Telespazio UK Ltd", email = "hannah.collingwood@telespazio.com" }
]

maintainers = [
  {name = "Telespazio UK Ltd", email = "hannah.collingwood@telespazio.com" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "boto3",
    "botocore",
    "configscanning",
    "pulsar-client",
    "requests>=2.32.0",
    "html-sanitizer",
]

[tool.uv.sources]
configscanning = { git = "https://github.com/EO-DataHub/configscanning.git", tag = "v0.1.4" }

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.42.44",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-mock",
    "pytest-watcher",
    "pytest-xdist",
    "ruff",
    "validate-pyproject",
]

[project.urls]
homepage = "https://github.com/EO-DataHub/eodhp-git-change-scanner"
repository = "https://github.com/EO-DataHub/eodhp-git-change-scanner"
changelog = "https://github.com/EO-DataHub/eodhp-git-change-scanner/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "FAST", # FastAPI
    "RUF",  # RUF-specific rules
    "SIM",  # Simplifications
    "B",    # Bugbear
    "ANN",  # Annotations
    "PLC",  # Pylint convention
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "FURB", # refurb
    "PT",   # pytest
]
ignore = [
    "E501",   # line too long
    "SIM108", # ternary operator
    "SIM103", # return bool directly
    "B008"    # function call in default argument (incompatible with FastAPI)
]
